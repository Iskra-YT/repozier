[package]
name = "repozier"
version = "0.1.0"
edition = "2024"
description = "Losowe repozytorium z GitHuba prosto z terminala"
license = "MIT"
repository = "https://github.com/Iskra-YT/repozier"
readme = "README.md"
keywords = ["github", "random", "cli", "repository"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"

[profile.release]
lto = true
strip = true
